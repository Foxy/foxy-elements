  <body>
    <main class="example">
      <section class="panel">
        <div class="shell dark">
          <foxy-payment-method-selector
            id="selector"
          ></foxy-payment-method-selector>
          <button
            id="tokenize-btn"
            style="margin-top: 1rem; width: 100%"
          >
            Tokenize
          </button>
          <pre
            id="tokenize-result"
            style="
              margin-top: 0.5rem;
              white-space: pre-wrap;
              word-break: break-all;
              font-size: 12px;
              color: #e7ffe8;
            "
          ></pre>
        </div>
      </section>
    </main>
    <script type="module">
      const btn = document.getElementById("tokenize-btn");
      const pre = document.getElementById("tokenize-result");
      const selector = document.getElementById("selector");

      btn.addEventListener("click", async () => {
        pre.textContent = "";
        try {
          const result = await selector.tokenize();
          pre.textContent = JSON.stringify(result, null, 2);
        } catch (err) {
          pre.textContent = String(err);
        }
      });
    </script>
  </body>
