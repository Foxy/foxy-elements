name: Release
on:
  push:
    branches:
      - main
      - beta
jobs:
  release:
    name: Release on GitHub and npm
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.semantic-release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.COMMIT_KEY }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run semantic release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Expose the tag this run created (empty when nothing was released) so the CDN job uploads the new version.
        run: |
          git tag --points-at HEAD | sort > "$RUNNER_TEMP/tags-before"
          npx semantic-release
          git tag --points-at HEAD | sort > "$RUNNER_TEMP/tags-after"
          echo "tag=$(comm -13 "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after" | head -n 1)" >> "$GITHUB_OUTPUT"
  upload-to-cdn:
    name: Upload to Foxy CDN
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run prepack
      - name: Upload to s3cdn
        uses: Foxy/foxy-github-action-s3cdn@main
        with:
          package-name: elements
        env:
          AWS_S3_CDN_BUCKET_NAME: ${{ secrets.AWS_S3_CDN_BUCKET_NAME }}
          AWS_S3_CDN_KEY_ID: ${{ secrets.AWS_S3_CDN_KEY_ID }}
          AWS_S3_CDN_KEY_SECRET: ${{ secrets.AWS_S3_CDN_KEY_SECRET }}
          SOURCE_DIR: 'dist/cdn'
          LATEST_TAG_NAME: ${{ needs.release.outputs.tag }}
      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_CDN_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_CDN_KEY_SECRET }}
          AWS_DEFAULT_REGION: us-east-1
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/elements*"
